name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a newer push supersedes a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # package-lock.json must stay committed: `npm ci` refuses to guess versions without it.
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # The deployed document is the only artefact an attacker can reach, so fail the deploy
      # rather than publish it without the policy.
      - name: Verify the shipped document
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'http-equiv="Content-Security-Policy"' dist/index.html
          grep -q "script-src 'self' 'nonce-" dist/index.html

      # SPA fallback: a direct hit on an unknown path should still serve the app shell.
      - name: Add 404 fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

